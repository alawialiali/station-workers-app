
name: Build Station Workers APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: unzip -q station_workers_android_project.zip -d project

      - name: Build APK
        run: gradle -p "project/حساب_عمال_المحطة_Android" --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp project/حساب_عمال_المحطة_Android/app/build/outputs/apk/debug/app-debug.apk output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Station-Workers-APK
          path: output/app-debug.apk
